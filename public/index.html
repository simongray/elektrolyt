<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- the bars' colour, the app's own dark grey, until main.cljs sets the page's -->
    <meta name="theme-color" content="#353535">
    <!-- before anything renders, so not deferred -->
    <script src="/theme.js"></script>
    <title>Elektrolyt</title>
    <!-- the text, and the bold of the headings and the buttons, which the
         browser would else ask for only once they render, and then swap in -->
    <link rel="preload" href="/fonts/charis-7.000/Charis-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/charis-7.000/Charis-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <!-- the files that app.css imports, at the URLs that its imports resolve
         to, which would else wait for app.css, and the deferred scripts for
         them (HTML, 4.2.4, the interactions of styling and scripting). A link
         can't name a cascade layer, so the imports stay. -->
    <link rel="preload" href="/css/tokens.css" as="style">
    <link rel="preload" href="/css/layout.css" as="style">
    <link rel="preload" href="/css/look.css" as="style">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/shared.js" defer></script>
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <div id="app">
      <noscript>This app needs JavaScript to run.</noscript>
    </div>
  </body>
</html>
