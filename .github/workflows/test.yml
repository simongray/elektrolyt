name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Java 25, Node 24, Firefox and Chrome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Lint
        run: clojure -Sdeps '{:deps {clj-kondo/clj-kondo {:mvn/version "2026.10.20"}}}' -M -m clj-kondo.main --lint src test dev

      # The build runs the tests itself, but exits 0 when one fails, so
      # node runs the built file, and its exit code fails the step.
      - name: Node tests
        run: |
          npm ci
          clojure -M:cljs compile test --config-merge '{:autorun false}'
          node target/node-tests.js

      - name: Server tests
        run: clojure -X:server:test

      # Firefox plays through a sound server, which the runner lacks: without
      # one, its audio sink fails and so does the element, a moment after it
      # starts. PulseAudio gives it a silent sink where there's no device.
      - name: A sound server for Firefox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1

      # The tests run against a release of the app in target/release/, as a
      # listener gets it, in Playwright's Firefox and the runner's own
      # Chrome, with the libraries of deps.edn rather than checkouts beside
      # this one. Locally, npm run e2e runs them against the watch's build.
      - name: End-to-end tests
        env:
          E2E_ALIASES: ':server'
          E2E_RELEASE: '1'
        run: |
          clojure -M:cljs clj-run user/release!
          npx playwright install --with-deps firefox
          npm run e2e

      - name: The traces of the end-to-end tests that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: target/e2e

      # A release build into a snapshot of its own, which fails where a
      # module is over its budget in dev/sizes.edn
      - name: Release build and sizes
        run: clojure -M:cljs clj-run sizes/check!

      - name: The report of the release build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: target/build-report.html
          if-no-files-found: ignore

  # The budgets of the key flows, in the runner's Chrome at a quarter of its
  # CPU's speed, against a release. They were calibrated on a faster
  # machine, so the job reports without failing the run until they're
  # calibrated here.
  perf:
    name: Performance budgets
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: The key flows within their budgets
        env:
          E2E_ALIASES: ':server'
          E2E_RELEASE: '1'
        run: |
          npm ci
          clojure -M:cljs clj-run user/release!
          npm run perf

      - name: The traces of the flows over budget
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: perf-traces
          path: target/perf
