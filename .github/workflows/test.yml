name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Java 25, Node 24, Firefox and Chrome
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Lint
        run: clojure -Sdeps '{:deps {clj-kondo/clj-kondo {:mvn/version "2026.08.04"}}}' -M -m clj-kondo.main --lint src test dev server

      # The build runs the tests itself, but exits 0 when one fails, so
      # node runs the built file, and its exit code fails the step.
      - name: Node tests
        run: |
          npm ci
          clojure -M:cljs compile test --config-merge '{:autorun false}'
          node target/node-tests.js

      - name: Server tests
        run: clojure -X:server:test

      # The tests run against the app built into public/, in Playwright's
      # Firefox and the runner's own Chrome, with the libraries of deps.edn
      # rather than checkouts beside this one
      - name: End-to-end tests
        env:
          E2E_ALIASES: ':server'
        run: |
          clojure -M:cljs compile app
          npx playwright install --with-deps firefox
          npm run e2e

      - name: The traces of the end-to-end tests that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: target/e2e
